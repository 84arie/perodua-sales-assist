name: Build PERODUA SALES ASSIST APK

on:
  workflow_dispatch:
  push:
    paths:
      - "android-wrapper/**"
      - ".github/workflows/build-android-apk.yml"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build debug APK
        working-directory: android-wrapper
        run: gradle assembleDebug

      - name: Rename APK
        run: |
          mkdir -p apk-output
          cp android-wrapper/app/build/outputs/apk/debug/app-debug.apk apk-output/PERODUA-SALES-ASSIST.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: PERODUA-SALES-ASSIST-APK
          path: apk-output/PERODUA-SALES-ASSIST.apk
          retention-days: 30
